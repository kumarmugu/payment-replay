application:
  name: payment-replay-tool
  version: 1.0.0

# ─────────────────────────────────────────────────────────────────────────────
# OUTPUT DIRECTORY FOR SANITIZED FILES
# ─────────────────────────────────────────────────────────────────────────────
output:
  directory: ./output

# ─────────────────────────────────────────────────────────────────────────────
# FILTER-MASK SETTINGS
# ─────────────────────────────────────────────────────────────────────────────
filterMask:
  # Suffix appended to output filenames for Leg 1 (pacs.008 + admn.005)
  leg1FileSuffix: "_leg1"
  # Suffix appended to output filenames for Leg 3 (pacs.002)
  leg3FileSuffix: "_leg3"

  # Number of files processed concurrently.
  # Rule of thumb: set to number of switch folders (4) or IO-bound core count.
  # At 250 TPS with 4 switch folders 4 threads is optimal.
  fileProcessingThreads: 4

  # Size of the bounded queue feeding writer threads.
  # Larger = more memory but smoother throughput under burst load.
  writerQueueSize: 2000

# ─────────────────────────────────────────────────────────────────────────────
# REPLAY SETTINGS
# ─────────────────────────────────────────────────────────────────────────────
replay:
  # Time-window grouping interval in seconds.
  # 60 = one-minute batches; use smaller values for sub-minute timing fidelity.
  groupingIntervalSeconds: 60

  # Maximum messages sent to MQ per second (across all legs combined).
  # 250 matches expected production peak TPS.
  maxMessagesPerSecond: 250

  # Directory containing sanitized files to replay (output of filter-mask).
  inputDirectory: ./output

  # Which legs to replay:
  #   leg1  — replay only Leg 1 files (_leg1)
  #   leg3  — replay only Leg 3 files (_leg3)
  #   both  — replay Leg 1 and Leg 3 concurrently in separate threads
  replayLegs: both

# ─────────────────────────────────────────────────────────────────────────────
# IBM MQ CONFIGURATION
# ─────────────────────────────────────────────────────────────────────────────
mq:
  site1:
    queueManager: QM_SITE1
    host: mq-site1.example.com
    port: 1414
    channel: SVRCONN.SITE1
    queueNamePrefix: ""
    connectionTimeout: 30000
    retryCount: 3
    retryDelayMs: 5000
    username: ""
    password: ""
  site2:
    queueManager: QM_SITE2
    host: mq-site2.example.com
    port: 1414
    channel: SVRCONN.SITE2
    queueNamePrefix: ""
    connectionTimeout: 30000
    retryCount: 3
    retryDelayMs: 5000
    username: ""
    password: ""

# ─────────────────────────────────────────────────────────────────────────────
# METRICS AND REPORTING
# ─────────────────────────────────────────────────────────────────────────────
metrics:
  enabled: true
  reportIntervalSeconds: 60

errorReport:
  outputDirectory: ./reports
  filenamePattern: "error-report-{date}.csv"
