# Bank Mapping Configuration
# Maps production BIC codes to UAT BIC codes.
# Applied to both the XML payload and the derived queue name.

banks:
  - productionBic: DBSSSGSG
    uatBic: DBSSSGS0

  - productionBic: OCBCSGSG
    uatBic: OCBCUTS0

  - productionBic: UABORSGSG
    uatBic: UABORSGS0

  - productionBic: HABORSGSG
    uatBic: HABORSGS0

  - productionBic: ZYBNSGSG
    uatBic: ZYBNSGS0
